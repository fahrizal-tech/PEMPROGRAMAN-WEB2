<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Kursus Saya · Portal Pelajar Nexus LMS</title>
  <meta name="description" content="Kursus yang diambil mahasiswa, pengajuan KRS, dan katalog kursus yang dibuka.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=optional">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
  <link rel="stylesheet" href="../assets/css/app.css">
  <!-- Proteksi sesi: tanpa defer agar berjalan sebelum konten tampil -->
  <script src="../assets/js/core/auth.js"></script>
  <script src="../assets/data/seed.js" defer></script>
  <script src="../assets/js/core/storage.js" defer></script>
  <script src="../assets/js/core/utils.js" defer></script>
  <script src="../assets/js/core/validators.js" defer></script>
  <script src="../assets/js/core/services.js" defer></script>
  <script src="../assets/js/components/ui.js" defer></script>
  <script src="../assets/js/components/cover.js" defer></script>
  <script src="../assets/js/components/layout.js" defer></script>
  <script src="../assets/js/pelajar/kursus.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <aside data-component="sidebar"></aside>

  <div class="flex min-h-screen flex-col lg:pl-64">
    <header data-component="topbar" data-title="Kursus Saya"></header>

    <main class="flex-1 min-w-0 space-y-6 p-4 lg:p-6">
      <section>
        <p class="text-[11px] font-semibold uppercase tracking-wider text-blue-600" id="info-periode">Kartu Rencana Studi</p>
        <h2 class="mt-1 text-2xl font-bold tracking-tight text-slate-900">Kursus Saya</h2>
        <p class="mt-1 text-sm text-slate-500" id="info-krs">Kursus yang Anda ambil semester ini dan pengajuan KRS.</p>
      </section>

      <!-- KRS saya -->
      <section class="rounded-xl border border-slate-200 bg-white shadow-sm" aria-labelledby="judul-krs">
        <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 px-5 py-4">
          <h3 id="judul-krs" class="text-base font-semibold text-slate-900">KRS Saya</h3>
          <p class="text-xs text-slate-500" id="ringkas-krs"></p>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full text-sm">
            <caption class="sr-only">Daftar KRS milik Anda</caption>
            <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">
              <tr>
                <th scope="col" class="px-5 py-3">Kursus</th>
                <th scope="col" class="px-5 py-3">SKS</th>
                <th scope="col" class="px-5 py-3">Dosen</th>
                <th scope="col" class="px-5 py-3">Diajukan</th>
                <th scope="col" class="px-5 py-3">Status</th>
                <th scope="col" class="px-5 py-3 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-krs" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </section>

      <!-- Katalog -->
      <section aria-labelledby="judul-katalog" class="space-y-4">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h3 id="judul-katalog" class="text-base font-semibold text-slate-900">Katalog Kursus Dibuka</h3>
            <p class="text-xs text-slate-500">Ajukan KRS; BAAK akan memvalidasi pengajuan Anda.</p>
          </div>
          <div class="relative w-full sm:w-80">
            <label for="cari" class="sr-only">Cari kursus</label>
            <span class="material-symbols-outlined pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-slate-400" aria-hidden="true">search</span>
            <input id="cari" type="search" placeholder="Cari kode, nama kursus, atau dosen…" class="block w-full rounded-lg border-slate-300 pl-9 text-sm focus:border-blue-500 focus:ring-blue-500">
          </div>
        </div>
        <div id="katalog" class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3"></div>
      </section>
    </main>

    <footer data-component="footer"></footer>
  </div>
</body>
</html>
