<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data - LMS Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            max-width: 800px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
            color: var(--text-main);
        }
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
        }
        .form-control:disabled {
            background: var(--bg-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-secondary:hover {
            background: var(--bg-color);
        }
        .form-actions {
            margin-top: 32px;
            display: flex;
            gap: 12px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-layer-group"></i> LMS Admin
            </div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                <li><a href="data-master.html" class="active"><i class="fas fa-users"></i> Data Master</a></li>
                <li><a href="#"><i class="fas fa-book"></i> Modul</a></li>
                <li><a href="laporan.html"><i class="fas fa-chart-bar"></i> Laporan</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Search here...">
                </div>
                <div class="topbar-right">
                    <div class="bell-icon"><i class="far fa-bell"></i></div>
                    <div class="user-profile">
                        <img src="https://ui-avatars.com/api/?name=Sarah+Connor&background=333&color=fff" alt="Sarah Connor">
                        <div class="info">
                            <span class="name">Sarah Connor</span>
                            <span class="role">Administrator</span>
                        </div>
                    </div>
                </div>
            </header>

            <main class="content-area">
                <div class="page-header">
                    <div>
                        <h1>Add New Student</h1>
                        <p>Fill in the details below to register a new student</p>
                    </div>
                </div>

                <div class="form-card">
                    <form id="addForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Student ID</label>
                                <input type="text" class="form-control" value="STU-008" disabled>
                            </div>
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="name" class="form-control" placeholder="e.g. Budi Santoso" required>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" id="email" class="form-control" placeholder="e.g. budi@university.com" required>
                            </div>
                            <div class="form-group">
                                <label>Enrolled Course</label>
                                <select class="form-control" required>
                                    <option value="" disabled selected>Select a course</option>
                                    <option>Intro to UI/UX Design</option>
                                    <option>Advanced Data Structures</option>
                                    <option>Product Management 101</option>
                                    <option>React Framework Basics</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save Data</button>
                            <button type="button" class="btn-secondary" onclick="window.location.href='data-master.html'">Cancel</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script>
        document.getElementById('addForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            alert('Student "' + name + '" successfully registered! (Mockup)');
            window.location.href = 'data-master.html';
        });
    </script>
</body>
</html>
