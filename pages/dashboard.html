<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LMS Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .stat-icon {
            font-size: 32px;
            color: var(--primary-color);
            background: rgba(25, 118, 210, 0.1);
            padding: 15px;
            border-radius: 50%;
        }
        .stat-info h4 {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 5px;
        }
        .stat-info h2 {
            font-size: 24px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-graduation-cap"></i> LMS Admin</h3>
            </div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="data-master.html"><i class="fas fa-users"></i> Data Siswa</a></li>
                <li><a href="form.html"><i class="fas fa-user-plus"></i> Form Siswa</a></li>
                <li><a href="laporan.html"><i class="fas fa-chart-bar"></i> Laporan</a></li>
                <li style="margin-top: auto;"><a href="../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="main-content">
            <header class="top-header">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="user-profile">
                    <span style="font-weight: 500;">Admin User</span>
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=1976D2&color=fff" alt="User Profile">
                </div>
            </header>

            <main class="content-area">
                <h2 style="margin-bottom: 20px;">Dashboard Overview</h2>
                
                <div class="stat-grid">
                    <div class="card stat-card">
                        <div class="stat-icon"><i class="fas fa-users"></i></div>
                        <div class="stat-info">
                            <h4>Total Siswa</h4>
                            <h2>1,250</h2>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon"><i class="fas fa-book"></i></div>
                        <div class="stat-info">
                            <h4>Total Kursus</h4>
                            <h2>45</h2>
                        </div>
                    </div>
                    <div class="card stat-card">
                        <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                        <div class="stat-info">
                            <h4>Lulus</h4>
                            <h2>890</h2>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3 style="margin-bottom: 15px;">Aktivitas Belajar Bulanan</h3>
                    <canvas id="activityChart" height="100"></canvas>
                </div>
            </main>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        // Chart.js Implementation
        const ctx = document.getElementById('activityChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun'],
                datasets: [{
                    label: 'Pendaftaran Kursus Baru',
                    data: [65, 59, 80, 81, 56, 120],
                    backgroundColor: '#1976D2',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'top', }
                }
            }
        });
    </script>
</body>
</html>
