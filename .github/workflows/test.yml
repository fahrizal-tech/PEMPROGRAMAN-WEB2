# Menjalankan uji unit & uji E2E browser di setiap push dan pull request.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit kerentanan dependensi
        run: npm audit --audit-level=high
      - name: Cek CSS hasil build sudah diperbarui
        run: |
          npm run build:css
          git diff --exit-code -- assets/css/app.css || (echo "::error::assets/css/app.css belum di-build ulang. Jalankan: npm run build:css" && exit 1)
      - name: Uji unit
        run: npm test
      - name: Validasi HTML (file mentah + DOM hasil render)
        run: npm run test:html
        env:
          BROWSER_PATH: /usr/bin/google-chrome
      - name: Audit aksesibilitas (axe-core + keyboard)
        run: npm run test:a11y
        env:
          BROWSER_PATH: /usr/bin/google-chrome
      - name: Uji E2E (Chrome)
        run: npm run test:e2e
        env:
          BROWSER_PATH: /usr/bin/google-chrome
