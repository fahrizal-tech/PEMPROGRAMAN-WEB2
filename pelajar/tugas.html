<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Tugas · Portal Pelajar Nexus LMS</title>
  <meta name="description" content="Daftar tugas dan kuis, pengumpulan jawaban, dan nilai mahasiswa.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=optional">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
  <link rel="stylesheet" href="../assets/css/app.css">
  <!-- Proteksi sesi: tanpa defer agar berjalan sebelum konten tampil -->
  <script src="../assets/js/core/auth.js"></script>
  <script src="../assets/data/seed.js" defer></script>
  <script src="../assets/js/core/storage.js" defer></script>
  <script src="../assets/js/core/utils.js" defer></script>
  <script src="../assets/js/core/validators.js" defer></script>
  <script src="../assets/js/core/services.js" defer></script>
  <script src="../assets/js/components/ui.js" defer></script>
  <script src="../assets/js/components/cover.js" defer></script>
  <script src="../assets/js/components/layout.js" defer></script>
  <script src="../assets/js/pelajar/tugas.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <aside data-component="sidebar"></aside>

  <div class="flex min-h-screen flex-col lg:pl-64">
    <header data-component="topbar" data-title="Tugas"></header>

    <main class="flex-1 min-w-0 space-y-6 p-4 lg:p-6">
      <section>
        <p class="text-[11px] font-semibold uppercase tracking-wider text-blue-600">Asesmen</p>
        <h2 class="mt-1 text-2xl font-bold tracking-tight text-slate-900">Tugas &amp; Kuis</h2>
        <p class="mt-1 text-sm text-slate-500">Kumpulkan jawaban sebelum tenggat. Jawaban dapat diperbarui selama belum dinilai.</p>
      </section>
      <div class="flex flex-wrap gap-2" role="group" aria-label="Saring tugas" id="filter-tugas">
        <button type="button" data-filter="semua" aria-pressed="true" class="rounded-full border px-3.5 py-1.5 text-sm font-semibold">Semua</button>
        <button type="button" data-filter="belum" aria-pressed="false" class="rounded-full border px-3.5 py-1.5 text-sm font-semibold">Belum dikumpulkan</button>
        <button type="button" data-filter="menunggu" aria-pressed="false" class="rounded-full border px-3.5 py-1.5 text-sm font-semibold">Menunggu nilai</button>
        <button type="button" data-filter="dinilai" aria-pressed="false" class="rounded-full border px-3.5 py-1.5 text-sm font-semibold">Sudah dinilai</button>
      </div>
      <section aria-label="Daftar tugas" id="daftar-tugas" class="grid grid-cols-1 gap-4 lg:grid-cols-2"></section>
    </main>

    <footer data-component="footer"></footer>
  </div>
</body>
</html>
