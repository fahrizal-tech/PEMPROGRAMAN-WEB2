<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan - LMS Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-graduation-cap"></i> LMS Admin</h3>
            </div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="data-master.html"><i class="fas fa-users"></i> Data Siswa</a></li>
                <li><a href="form.html"><i class="fas fa-user-plus"></i> Form Siswa</a></li>
                <li><a href="laporan.html"><i class="fas fa-chart-bar"></i> Laporan</a></li>
                <li style="margin-top: auto;"><a href="../index.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <div class="main-content">
            <header class="top-header">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="user-profile">
                    <span style="font-weight: 500;">Admin User</span>
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=1976D2&color=fff" alt="User Profile">
                </div>
            </header>

            <main class="content-area">
                <h2 style="margin-bottom: 20px;">Laporan Nilai Siswa</h2>

                <div class="card" id="printableArea">
                    <div style="text-align: center; margin-bottom: 20px;">
                        <h3>Rekapitulasi Nilai Ujian Semester Genap</h3>
                        <p style="color: var(--text-secondary);">Tahun Ajaran 2023/2024</p>
                    </div>
                    
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background: #f8f9fa;">
                                <th style="padding: 10px; border: 1px solid #ddd;">No</th>
                                <th style="padding: 10px; border: 1px solid #ddd;">Nama Siswa</th>
                                <th style="padding: 10px; border: 1px solid #ddd;">Mata Pelajaran</th>
                                <th style="padding: 10px; border: 1px solid #ddd;">Nilai Akhir</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="padding: 10px; border: 1px solid #ddd; text-align:center;">1</td>
                                <td style="padding: 10px; border: 1px solid #ddd;">Ahmad Budi</td>
                                <td style="padding: 10px; border: 1px solid #ddd;">Matematika</td>
                                <td style="padding: 10px; border: 1px solid #ddd; text-align:center;">85</td>
                            </tr>
                            <tr>
                                <td style="padding: 10px; border: 1px solid #ddd; text-align:center;">2</td>
                                <td style="padding: 10px; border: 1px solid #ddd;">Siti Aminah</td>
                                <td style="padding: 10px; border: 1px solid #ddd;">Fisika</td>
                                <td style="padding: 10px; border: 1px solid #ddd; text-align:center;">92</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <button class="btn btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Cetak Laporan</button>
            </main>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
</body>
</html>
